name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
      - name: Version is bumped when the library changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE_REF...HEAD" -- src/Postmark; then
            echo "src/Postmark is unchanged; no version bump needed."
            exit 0
          fi
          version() { sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ; }
          head_version=$(version < src/Postmark/Postmark.csproj)
          base_version=$(git show "origin/$BASE_REF:src/Postmark/Postmark.csproj" | version)
          if [ "$head_version" = "$base_version" ]; then
            echo "::error file=src/Postmark/Postmark.csproj::src/Postmark changed but <Version> is still $base_version. Bump it."
            exit 1
          fi
          echo "Version $base_version -> $head_version"
      - name: Unit tests
        run: dotnet test src/Postmark.Tests/Postmark.Tests.csproj -c Release --filter "Category!=Integration"
      - run: dotnet pack src/Postmark/Postmark.csproj -c Release -o out
